services:
  - type: web
    name: paperape-api
    runtime: node
    region: oregon
    plan: standard  # $25/mo — 1 CPU, 2GB RAM, always-on
    buildCommand: npm install --include=dev && npm run build --workspace=@paperape/shared && npm run build --workspace=@paperape/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: CORS_ORIGINS
        value: "https://paperape.vercel.app,https://paperape.com,https://www.paperape.com,https://paperape.fun,https://www.paperape.fun"
      - key: MOCK_MODE
        value: "false"
      # Firebase (REQUIRED)
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      # Helius RPC (https://dev.helius.xyz)
      - key: HELIUS_API_KEY
        sync: false
      - key: HELIUS_RPC_URL
        sync: false
      # Birdeye (https://birdeye.so/api)
      - key: BIRDEYE_API_KEY
        sync: false
      # Upstash Redis (https://upstash.com)
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
