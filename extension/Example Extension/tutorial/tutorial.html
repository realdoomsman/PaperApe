<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>MockApe Tutorial</title>
    <link rel="stylesheet" href="tutorial.css" />
  </head>
  <body>
    <div class="tutorial-container">
      <div class="header-controls">
        <button class="restart-button" title="Restart Tutorial">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
          </svg>
        </button>
        <div class="toggle-switch">
          <label class="switch">
            <input type="checkbox" id="extensionToggle" />
            <span class="slider round"></span>
          </label>
        </div>
      </div>
      <div class="tutorial-content">
        <img
          class="logo-placeholder"
          src="./assets/mascot.png"
          alt="MockApe Logo"
        />
        <h1>Welcome to MockApe</h1>
        <div class="platform-selection">
          <h2>Select Your Preferred Trading Platform</h2>
          <div class="platform-options">
            <button class="platform-button" data-platform="axiom">
              <span class="platform-name">Axiom</span>
              <div class="token-badges">
                <span class="token-badge sol">SOL</span>
                <span class="token-badge bnb">BNB</span>
              </div>
            </button>
            <button class="platform-button" data-platform="gmgn">
              <span class="platform-name">GMGN</span>
              <div class="token-badges">
                <span class="token-badge sol">SOL</span>
                <span class="token-badge bnb">BNB</span>
              </div>
            </button>
            <button class="platform-button" data-platform="padre">
              <span class="platform-name">Padre</span>
              <div class="token-badges">
                <span class="token-badge sol">SOL</span>
                <span class="token-badge bnb">BNB</span>
              </div>
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="tutorial.js"></script>
  </body>
</html>
